[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-integration-service"
version = "0.1.0"
description = "FastAPI integration backend with Celery, Redis, PostgreSQL, idempotency and retries"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.52,<2.1",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.6,<6",
  "redis>=6,<8",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
